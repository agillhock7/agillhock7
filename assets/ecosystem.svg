<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="ecosystem-title ecosystem-description">
  <title id="ecosystem-title">The Forward Lab product ecosystem</title>
  <desc id="ecosystem-description">Six production systems connect money, movement, identity, media, logistics, and community.</desc>
  <defs>
    <linearGradient id="eco-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07110F" />
      <stop offset="0.5" stop-color="#0B1916" />
      <stop offset="1" stop-color="#091411" />
    </linearGradient>
    <radialGradient id="core-halo">
      <stop offset="0" stop-color="#8CCAAF" stop-opacity="0.28" />
      <stop offset="1" stop-color="#8CCAAF" stop-opacity="0" />
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#8CCAAF" fill-opacity="0.08" />
    </pattern>
    <filter id="eco-glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .route { fill: none; stroke-width: 2; stroke-opacity: .62; stroke-dasharray: 9 14; animation: flow 8s linear infinite; }
    .node { transform-box: fill-box; transform-origin: center; animation: breathe 5s ease-in-out infinite; }
    .ring { transform-origin: 600px 250px; animation: rotate 32s linear infinite; }
    .core { animation: core 3s ease-in-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -184; } }
    @keyframes breathe { 0%, 100% { opacity: .82; } 50% { opacity: 1; } }
    @keyframes rotate { to { transform: rotate(360deg); } }
    @keyframes core { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .route, .node, .ring, .core { animation: none !important; } }
  </style>

  <rect width="1200" height="500" rx="16" fill="url(#eco-bg)" />
  <rect x="1" y="1" width="1198" height="498" rx="15" fill="none" stroke="#24483F" />
  <rect width="1200" height="500" rx="16" fill="url(#dots)" />

  <g font-family="Verdana,Geneva,DejaVu Sans,sans-serif">
    <text x="48" y="52" fill="#8CCAAF" font-size="13" font-weight="700" letter-spacing="2.4">THE PRODUCT CONSTELLATION</text>
    <text x="1152" y="52" text-anchor="end" fill="#58786E" font-size="11" letter-spacing="1.4">SIX SYSTEMS // ONE OPERATING PHILOSOPHY</text>
    <path class="route route-0" d="M515 250 C405 250 405 145 371 145" stroke="#38BDF8" style="animation-delay:-0.0s" /><path class="route route-1" d="M515 250 C405 250 405 250 371 250" stroke="#2DD4BF" style="animation-delay:-1.1s" /><path class="route route-2" d="M515 250 C405 250 405 355 371 355" stroke="#A78BFA" style="animation-delay:-2.2s" /><path class="route route-3" d="M685 250 C795 250 795 145 829 145" stroke="#60A5FA" style="animation-delay:-3.3000000000000003s" /><path class="route route-4" d="M685 250 C795 250 795 250 829 250" stroke="#F5B942" style="animation-delay:-4.4s" /><path class="route route-5" d="M685 250 C795 250 795 355 829 355" stroke="#FB923C" style="animation-delay:-5.5s" />

    <circle cx="600" cy="250" r="142" fill="url(#core-halo)" />
    <circle class="ring" cx="600" cy="250" r="103" fill="none" stroke="#8CCAAF" stroke-opacity="0.28" stroke-dasharray="3 12" />
    <circle cx="600" cy="250" r="84" fill="#07110F" stroke="#315E52" stroke-width="2" />
    <circle class="core" cx="600" cy="250" r="67" fill="#102B25" stroke="#8CCAAF" stroke-opacity="0.55" filter="url(#eco-glow)" />
    <text x="600" y="231" text-anchor="middle" fill="#F1FFF9" font-size="20" font-weight="800" letter-spacing="1.8">FORWARD</text>
    <text x="600" y="257" text-anchor="middle" fill="#8CCAAF" font-size="16" font-weight="700" letter-spacing="4">LAB</text>
    <text x="600" y="281" text-anchor="middle" fill="#668A7E" font-size="9" letter-spacing="1.5">BUILD · SHIP · OPERATE</text>
    <g class="node" style="animation-delay:-0.0s"><rect x="119" y="106" width="252" height="78" rx="13" fill="#0B1916" stroke="#38BDF8" stroke-opacity="0.6" /><rect x="119" y="106" width="5" height="78" rx="2.5" fill="#38BDF8" /><circle cx="142" cy="129" r="6" fill="#38BDF8" /><text x="158" y="133" fill="#38BDF8" font-size="10" font-weight="700" letter-spacing="1.4">MONEY</text><text x="139" y="160" fill="#E8FFF5" font-size="17" font-weight="700">OnLedge</text><text x="351" y="133" text-anchor="end" fill="#58786E" font-size="8" letter-spacing="1">FLAGSHIP</text></g><g class="node" style="animation-delay:-1.1s"><rect x="119" y="211" width="252" height="78" rx="13" fill="#0B1916" stroke="#2DD4BF" stroke-opacity="0.6" /><rect x="119" y="211" width="5" height="78" rx="2.5" fill="#2DD4BF" /><circle cx="142" cy="234" r="6" fill="#2DD4BF" /><text x="158" y="238" fill="#2DD4BF" font-size="10" font-weight="700" letter-spacing="1.4">MOVEMENT</text><text x="139" y="265" fill="#E8FFF5" font-size="17" font-weight="700">EveryMile</text><text x="351" y="238" text-anchor="end" fill="#58786E" font-size="8" letter-spacing="1">FLAGSHIP</text></g><g class="node" style="animation-delay:-2.2s"><rect x="119" y="316" width="252" height="78" rx="13" fill="#0B1916" stroke="#A78BFA" stroke-opacity="0.6" /><rect x="119" y="316" width="5" height="78" rx="2.5" fill="#A78BFA" /><circle cx="142" cy="339" r="6" fill="#A78BFA" /><text x="158" y="343" fill="#A78BFA" font-size="10" font-weight="700" letter-spacing="1.4">IDENTITY + AI</text><text x="139" y="370" fill="#E8FFF5" font-size="17" font-weight="700">MySite</text><text x="351" y="343" text-anchor="end" fill="#58786E" font-size="8" letter-spacing="1">FLAGSHIP</text></g><g class="node" style="animation-delay:-3.3000000000000003s"><rect x="829" y="106" width="252" height="78" rx="13" fill="#0B1916" stroke="#60A5FA" stroke-opacity="0.6" /><rect x="829" y="106" width="5" height="78" rx="2.5" fill="#60A5FA" /><circle cx="852" cy="129" r="6" fill="#60A5FA" /><text x="868" y="133" fill="#60A5FA" font-size="10" font-weight="700" letter-spacing="1.4">MEDIA</text><text x="849" y="160" fill="#E8FFF5" font-size="17" font-weight="700">Slapshot Snapshot</text><text x="1061" y="133" text-anchor="end" fill="#58786E" font-size="8" letter-spacing="1">FROM THE LAB</text></g><g class="node" style="animation-delay:-4.4s"><rect x="829" y="211" width="252" height="78" rx="13" fill="#0B1916" stroke="#F5B942" stroke-opacity="0.6" /><rect x="829" y="211" width="5" height="78" rx="2.5" fill="#F5B942" /><circle cx="852" cy="234" r="6" fill="#F5B942" /><text x="868" y="238" fill="#F5B942" font-size="10" font-weight="700" letter-spacing="1.4">LOGISTICS</text><text x="849" y="265" fill="#E8FFF5" font-size="17" font-weight="700">Parcel Tracker</text><text x="1061" y="238" text-anchor="end" fill="#58786E" font-size="8" letter-spacing="1">FROM THE LAB</text></g><g class="node" style="animation-delay:-5.5s"><rect x="829" y="316" width="252" height="78" rx="13" fill="#0B1916" stroke="#FB923C" stroke-opacity="0.6" /><rect x="829" y="316" width="5" height="78" rx="2.5" fill="#FB923C" /><circle cx="852" cy="339" r="6" fill="#FB923C" /><text x="868" y="343" fill="#FB923C" font-size="10" font-weight="700" letter-spacing="1.4">COMMUNITY</text><text x="849" y="370" fill="#E8FFF5" font-size="17" font-weight="700">Feed a Bum</text><text x="1061" y="343" text-anchor="end" fill="#58786E" font-size="8" letter-spacing="1">FROM THE LAB</text></g>
  </g>
</svg>
