name: Update Forward Lab Profile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - "profile.yml"
      - "requirements-*.txt"
      - ".github/workflows/update-profile-cards.yml"
      - ".github/workflows/refresh-project-previews.yml"
      - "scripts/test_*.py"
      - "scripts/profile_config.py"
      - "scripts/generate_stats_card.py"
      - "scripts/generate_header.py"
      - "scripts/generate_tech_badges.py"
      - "scripts/generate_featured_content.py"
      - "scripts/generate_top_languages_card.py"
      - "scripts/generate_streak_card.py"
      - "scripts/generate_activity_graph.py"
      - "scripts/generate_ecosystem.py"
      - "scripts/generate_telemetry.py"
      - "scripts/update_readme_cache_bust.py"
  schedule:
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Ensure assets directory
        run: mkdir -p assets

      - name: Install Python dependencies
        run: python3 -m pip install --user -r requirements-test.txt

      - name: Run profile regression suite
        run: |
          python3 -m unittest discover -s scripts -p "test_*.py"
          python3 -m py_compile scripts/*.py

      - name: Generate header
        if: github.event_name != 'schedule'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
          HEADER_HEIGHT: "340"
        run: python3 scripts/generate_header.py

      - name: Generate tech stack badges
        if: github.event_name != 'schedule'
        run: python3 scripts/generate_tech_badges.py

      - name: Generate featured project content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
        run: python3 scripts/generate_featured_content.py

      - name: Generate product constellation
        if: github.event_name != 'schedule'
        run: python3 scripts/generate_ecosystem.py

      - name: Generate live telemetry
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
          PRIVATE_REPO_COUNT: ${{ secrets.PRIVATE_REPO_COUNT }}
        run: python3 scripts/generate_telemetry.py

      - name: Update README cache bust query params
        run: python3 scripts/update_readme_cache_bust.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh Forward Lab profile"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
