name: Update Profile Cards

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    paths:
      - ".github/workflows/update-profile-cards.yml"
      - "scripts/generate_stats_card.py"
      - "scripts/generate_header.py"
      - "scripts/generate_tech_badges.py"
      - "scripts/generate_featured_content.py"
      - "scripts/generate_top_languages_card.py"
      - "scripts/generate_streak_card.py"
      - "scripts/update_readme_cache_bust.py"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Ensure assets directory
        run: mkdir -p assets

      - name: Install Python dependencies
        run: python3 -m pip install --user pillow

      - name: Generate header
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
          HEADER_HEIGHT: "240"
        run: python3 scripts/generate_header.py

      - name: Generate tech stack badges
        run: python3 scripts/generate_tech_badges.py

      - name: Generate featured project content
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
        run: python3 scripts/generate_featured_content.py

      - name: Generate stats card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
        run: python3 scripts/generate_stats_card.py

      - name: Generate top languages card
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
        run: python3 scripts/generate_top_languages_card.py

      - name: Generate streak card
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_USER: agillhock7
        run: python3 scripts/generate_streak_card.py

      - name: Download activity graph
        run: |
          CACHE_BUST="$(date -u +%Y%m%d%H%M)"
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 2 "https://github-readme-activity-graph.vercel.app/graph?username=agillhock7&bg_color=0b1220&color=8ccfaf&line=22c55e&point=9be9a8&area=true&area_color=1f5f4a&hide_border=true&custom_title=Contribution%20Activity&radius=8&v=${CACHE_BUST}" -o assets/activity-graph.svg

      - name: Update README cache bust query params
        run: python3 scripts/update_readme_cache_bust.py

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "chore: update profile cards"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
