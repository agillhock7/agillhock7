name: Refresh Production Previews

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 0"

permissions:
  contents: write

concurrency:
  group: profile-readme-writes
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install preview dependencies
        run: |
          python3 -m pip install --user -r requirements-previews.txt
          python3 -m playwright install --with-deps chromium

      - name: Capture production previews
        run: python3 scripts/capture_project_previews.py

      - name: Update content-hash asset versions
        run: python3 scripts/update_readme_cache_bust.py

      - name: Commit refreshed previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/previews README.md

          if git diff --cached --quiet; then
            echo "No preview changes to commit."
            exit 0
          fi

          git commit -m "chore: refresh production previews"
          git pull --rebase origin "${TARGET_BRANCH}"
          git push origin "HEAD:${TARGET_BRANCH}"
